<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)">
  <title>QuoteBank & MemeBank</title>
  <meta name="description" content="Share and vote on the best quotes and memes. A community-driven collection of wisdom and humor.">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="lang-switcher-wrap" title="Select language">
          <span class="lang-icon">🌐</span>
          <span class="lang-arrow">▾</span>
          <select id="lang-switcher" class="lang-switcher" aria-label="Select language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ca">Català</option>
          </select>
        </div>
        <a href="#memes" id="switch-feed-btn" class="switch-feed">
          <span class="switch-text" data-i18n="switch_to_meme">switch to MemeBank!</span>
          <span class="switch-icon">⇄</span>
        </a>
      </div>
      
      <a href="#quotes" class="logo" id="main-logo">Quote<span>Bank</span></a>
      
      <div class="header-right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
        <div id="auth-area"></div>
      </div>
    </div>
  </header>

  <!-- ── Main Content ────────────────────────────────────────────────────── -->
  <main class="main" id="app"></main>

  <!-- ── Modal ───────────────────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- ── Toast Container ─────────────────────────────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── Go To Top ───────────────────────────────────────────────────────── -->
  <button id="go-to-top" class="go-to-top" aria-label="Go to top">↑</button>

  <script type="module" src="/static/app.js" data-cfasync="false"></script>
</body>
</html>
