<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" id="meta-apple-status-bar" content="default">
  <meta name="theme-color" id="meta-theme-color" content="#161513">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("theme");
        var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = saved === "dark" || (!saved && sysDark);
        var m = document.getElementById("meta-theme-color");
        var a = document.getElementById("meta-apple-status-bar");
        if (isDark) {
          document.documentElement.setAttribute("data-theme", "dark");
          if (m) m.setAttribute("content", "#161513");
          if (a) a.setAttribute("content", "black-translucent");
        } else {
          document.documentElement.removeAttribute("data-theme");
          if (m) m.setAttribute("content", "#f3efe9");
          if (a) a.setAttribute("content", "default");
        }
      } catch(e) {}
    })();
  </script>
  <title>QuoteBank & MemeBank</title>
  <meta name="description" content="Share and vote on the best quotes and memes. A community-driven collection of wisdom and humor.">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="lang-switcher-wrap" title="Select language">
          <span class="lang-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span>
          <span class="lang-arrow"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
          <select id="lang-switcher" class="lang-switcher" aria-label="Select language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ca">Català</option>
          </select>
        </div>
      </div>

      <div class="logo-switcher-wrap" id="logo-switcher-wrap">
        <button class="logo" id="main-logo" type="button" aria-haspopup="true" aria-expanded="false" aria-label="QuoteBank, activate to switch feeds">
          <span class="logo-text" id="logo-text">Quote<span>Bank</span></span>
          <svg class="logo-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="feed-switcher-dropdown" id="feed-switcher-dropdown" role="menu" aria-label="Switch feed">
          <a href="#memes" class="feed-switcher-option" id="feed-switcher-other" role="menuitem">
            <span class="switcher-logo-text" id="switcher-other-text">Meme<span>Bank</span></span>
          </a>
        </div>
      </div>

      <div class="header-right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div id="auth-area"></div>
      </div>
    </div>
  </header>

  <!-- ── Main Content ────────────────────────────────────────────────────── -->
  <main class="main" id="app"></main>

  <!-- ── Modal ───────────────────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- ── Toast Container ─────────────────────────────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── Go To Top ───────────────────────────────────────────────────────── -->
  <button id="go-to-top" class="go-to-top" aria-label="Go to top">↑</button>

  <script type="module" src="/static/app.js" data-cfasync="false"></script>
</body>
</html>
